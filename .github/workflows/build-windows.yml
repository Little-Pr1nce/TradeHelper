name: Build Windows EXE

on:
  push:
    branches: [main, V2.0]
    tags: ['V2.0*']
  pull_request:
    branches: [main, V2.0]
  workflow_dispatch:   # 允许手动触发

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Python 3.12 + UTF-8
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: 强制 UTF-8 编码
        run: |
          # 设置控制台编码为 UTF-8，避免中文输出报错
          chcp 65001
        shell: cmd

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-runtime.txt
          pip install -r requirements-dev.txt
          # Windows CPU 版 torch，减小打包体积
          pip uninstall torch torchvision -y
          pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu

      - name: 验证所有关键模块可导入
        run: |
          python -c "import flet; print('flet OK')"
          python -c "import tickflow; print('tickflow OK')"
          python -c "import baostock; print('baostock OK')"
          python -c "import httpx; print('httpx OK')"
          python -c "import yfinance; print('yfinance OK')"
          python -c "import akshare; print('akshare OK')"
          python -c "import transformers; print('transformers OK')"
          python -c "import torch; print('torch OK')"
          python -c "import openai; print('openai OK')"
          python -c "import mplfinance; print('mplfinance OK')"

      - name: 准备 FinBERT 模型
        run: |
          python scripts/prepare_model.py
          python scripts/write_release_manifest.py

      - name: PyInstaller 打包（详细日志）
        run: |
          python -m PyInstaller tradehelper.spec --distpath dist/win --workpath build/win --noconfirm --log-level=INFO
        shell: cmd

      - name: 验证输出
        run: |
          if (Test-Path "dist/win/TradeHelper/TradeHelper.exe") {
            Write-Host "✓ 打包成功！"
            Get-ChildItem dist/win/TradeHelper/TradeHelper.exe | ForEach-Object { Write-Host "大小: $([math]::Round($_.Length/1MB, 1)) MB" }
          } else {
            Write-Host "✗ 打包失败！"
            Get-ChildItem dist/win/ -Recurse -ErrorAction SilentlyContinue | Select-Object FullName, Length | Format-Table -AutoSize
            exit 1
          }

      - name: 启动打包产物并执行运行时依赖检查
        shell: pwsh
        run: |
          $env:TRADEHELPER_SMOKE_TEST = "1"
          $env:TRADEHELPER_REQUIRE_FINBERT = "1"
          $env:TRADEHELPER_REQUIRE_MANIFEST = "1"
          $process = Start-Process -FilePath "dist/win/TradeHelper/TradeHelper.exe" -Wait -PassThru
          if ($process.ExitCode -ne 0) {
            throw "Packaged runtime smoke test failed with exit code $($process.ExitCode)"
          }
          Write-Host "Packaged runtime smoke test passed"

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: TradeHelper-Windows
          path: dist/win/TradeHelper/
          retention-days: 7
