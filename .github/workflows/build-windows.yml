name: Build Windows EXE

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:   # 允许手动触发
    inputs:
      upload_release:
        description: '上传到 Release（需要打 tag）'
        type: boolean
        default: false

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          # Windows CPU 版 torch，减小打包体积
          pip uninstall torch torchvision -y
          pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu

      - name: 准备 FinBERT 模型
        run: python scripts/prepare_model.py

      - name: PyInstaller 打包
        run: |
          python -m PyInstaller tradehelper.spec --distpath dist/win --workpath build/win --noconfirm

      - name: 验证输出
        run: |
          if (Test-Path "dist/win/TradeHelper/TradeHelper.exe") {
            Write-Host "✓ 打包成功！"
            Get-ChildItem dist/win/TradeHelper/TradeHelper.exe | ForEach-Object { Write-Host "大小: $([math]::Round($_.Length/1MB, 1)) MB" }
          } else {
            Write-Host "✗ 打包失败！"
            exit 1
          }

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: TradeHelper-Windows
          path: dist/win/TradeHelper/
          retention-days: 7
